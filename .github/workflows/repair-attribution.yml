name: Repair Daily Project Commit Attribution

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-python-creations
  cancel-in-progress: false

jobs:
  rewrite-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify target history and rewrite bot-authored commits
        shell: bash
        run: |
          set -euo pipefail
          BASE="068023fcd1f7e9814f78981f25748156487de9ef"
          EXPECTED_BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          TARGET_EMAIL="pargainlokesh5@gmail.com"

          git checkout -B main origin/main
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" origin/main

          bot_count="$(git rev-list "$BASE..origin/main" | while read -r sha; do
            email="$(git show -s --format='%ae' "$sha")"
            if [ "$email" = "$EXPECTED_BOT_EMAIL" ]; then echo "$sha"; fi
          done | wc -l)"
          echo "Bot-authored commits in repair range: $bot_count"
          if [ "$bot_count" -ne 10 ]; then
            echo "Expected exactly 10 bot-authored commits (Day 13 and Day 14). Refusing to rewrite."
            exit 1
          fi

          git config user.name "Lokesh Pargain"
          git config user.email "$TARGET_EMAIL"

          FILTER='
          if [ "$GIT_AUTHOR_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            export GIT_AUTHOR_NAME="Lokesh Pargain"
            export GIT_AUTHOR_EMAIL="pargainlokesh5@gmail.com"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            export GIT_COMMITTER_NAME="Lokesh Pargain"
            export GIT_COMMITTER_EMAIL="pargainlokesh5@gmail.com"
          fi
          '

          old_head="$(git rev-parse origin/main)"
          git filter-branch -f --env-filter "$FILTER" -- "$BASE..main"
          new_head="$(git rev-parse main)"

          if [ "$old_head" = "$new_head" ]; then
            echo "History did not change; refusing to push."
            exit 1
          fi

          # Keep the original author/committer timestamps; only the bot identity changes.
          git push --force-with-lease=refs/heads/main:"$old_head" origin main:main

      - name: Verify rewritten commit identities
        shell: bash
        run: |
          set -euo pipefail
          BASE="068023fcd1f7e9814f78981f25748156487de9ef"
          git fetch origin main
          bot_count="$(git rev-list "$BASE..origin/main" | while read -r sha; do
            email="$(git show -s --format='%ae' "$sha")"
            if [ "$email" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then echo "$sha"; fi
          done | wc -l)"
          if [ "$bot_count" -ne 0 ]; then
            echo "Some bot-authored commits remain in the target range."
            exit 1
          fi
          echo "No bot-authored commits remain in the rewritten range."
