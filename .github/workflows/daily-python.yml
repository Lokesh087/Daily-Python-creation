name: Daily Python Creations

on:
  schedule:
    # Primary: 10:00 AM IST. Backups help if GitHub delays a scheduled event.
    - cron: "30 4 * * *"
    - cron: "0 5 * * *"
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-python.yml"
      - "scripts/daily_pipeline.py"

permissions:
  contents: write

concurrency:
  group: daily-python-creations
  cancel-in-progress: false

jobs:
  create-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today's IST run is already complete
        id: daily_guard
        shell: bash
        run: |
          today="$(TZ=Asia/Kolkata date +%F)"
          previous=""
          if [ -f .github/daily-run-date.txt ]; then
            previous="$(tr -d '[:space:]' < .github/daily-run-date.txt)"
          fi
          if [ "$previous" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily generation already completed for $today (IST)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful generation recorded for $today (IST)."
          fi

      - name: Generate next daily project
        if: steps.daily_guard.outputs.skip != 'true'
        run: python scripts/daily_pipeline.py

      - name: Validate every Python project
        if: steps.daily_guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path(".").glob("Day-*/main.py"))
          if not files:
              raise SystemExit("No project sources found")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Record successful IST run date
        if: steps.daily_guard.outputs.skip != 'true'
        shell: bash
        run: |
          TZ=Asia/Kolkata date +%F > .github/daily-run-date.txt

      - name: Commit and push generated work
        if: steps.daily_guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Day-* README.md index.html .github/daily-run-date.txt
          if git diff --cached --quiet; then
            echo "No generated changes; nothing to commit."
            exit 0
          fi
          git commit -m "Add next daily Python creation"
          git push origin HEAD:main
