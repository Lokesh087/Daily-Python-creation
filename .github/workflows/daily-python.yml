name: Daily Python Creations

on:
  schedule:
    # Primary: 10:00 AM IST. Backups help if GitHub delays a scheduled event.
    - cron: "30 4 * * *"
    - cron: "0 5 * * *"
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-python]

permissions:
  contents: write

concurrency:
  group: daily-python-creations
  cancel-in-progress: false

jobs:
  create-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today's IST run is already complete
        id: daily_guard
        shell: bash
        run: |
          today="$(TZ=Asia/Kolkata date +%F)"
          previous=""
          if [ -f .github/daily-run-date.txt ]; then
            previous="$(tr -d '[:space:]' < .github/daily-run-date.txt)"
          fi
          if [ "$previous" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily generation already completed for $today (IST)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful generation recorded for $today (IST)."
          fi

      - name: Generate next daily project
        if: steps.daily_guard.outputs.skip != 'true'
        run: python scripts/daily_pipeline.py

      - name: Validate every Python project
        if: steps.daily_guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path(".").glob("Day-*/main.py"))
          if not files:
              raise SystemExit("No project sources found")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Record successful IST run date
        if: steps.daily_guard.outputs.skip != 'true'
        shell: bash
        run: |
          TZ=Asia/Kolkata date +%F > .github/daily-run-date.txt

      - name: Create contribution-aware commits and push
        if: steps.daily_guard.outputs.skip != 'true'
        shell: bash
        run: |
          # Attribute generated commits to the repository owner's verified GitHub email.
          # GitHub only counts these on the contribution graph if this email is verified
          # on the Lokesh087 account and the commits land on the default branch.
          git config user.name "Lokesh Pargain"
          git config user.email "pargainlokesh5@gmail.com"
          git config --global user.name "Lokesh Pargain"
          git config --global user.email "pargainlokesh5@gmail.com"

          project_dir="$(find . -maxdepth 1 -type d -name 'Day-*' | sort -V | tail -n 1)"
          if [ -z "$project_dir" ]; then
            echo "Generated project folder not found."
            exit 1
          fi

          day="$(basename "$project_dir" | cut -d '-' -f 2)"
          today="$(TZ=Asia/Kolkata date +%F)"

          # Pixel map: 7 weekday rows x 52 week columns, Sunday first.
          is_letter_day="false"
          if [[ "$today" > "2027-01-02" && "$today" < "2028-01-02" ]]; then
            is_letter_day="$(TODAY="$today" python - <<'PY'
          import os
          from datetime import date
          rows = ["....................................................","#...###.#.#.###.###.#.#..##...#..##...##..#..###.#.#","#...#.#.##..#...#...#.#..#.#.#.#.#.#.#...#.#..#..###","#...#.#.#...##..###.###..##..###.##..#.#.###..#..###","#...#.#.##..#.....#.#.#..#...#.#.#.#.#.#.#.#..#..###","###.###.#.#.###.###.#.#..#...#.#.#.#..##.#.#.###.#.#","...................................................."]
          today = date.fromisoformat(os.environ["TODAY"])
          start = date(2027, 1, 3)  # Sunday
          offset = (today - start).days
          if offset < 0 or offset >= 52 * 7:
              print("false")
          else:
              week = offset // 7
              weekday_row = (today.weekday() + 1) % 7
              print("true" if rows[weekday_row][week] == "#" else "false")
          PY
          )"
          fi

          commit_group() {
            message="$1"
            shift
            git add "$@"
            if ! git diff --cached --quiet; then
              git commit -m "$message"
            else
              echo "No staged changes for: $message"
            fi
          }

          if [ "$is_letter_day" = "true" ] || [[ "$today" < "2027-01-03" ]]; then
            echo "Letter date (or pre-map period): five meaningful project commits."
            commit_group "Add Day $day Python artwork" "$project_dir/main.py"
            commit_group "Document Day $day project" "$project_dir/README.md"
            commit_group "Add Day $day design notes" "$project_dir/DESIGN_NOTES.md"
            commit_group "Update daily project catalogue" README.md
            commit_group "Publish Day $day showcase and completion marker" index.html .github/daily-run-date.txt
          else
            echo "Background date: one consolidated meaningful daily project commit."
            git add "$project_dir" README.md index.html .github/daily-run-date.txt
            if ! git diff --cached --quiet; then
              git commit -m "Add Day $day Python creation and showcase"
            fi
          fi

          git push origin HEAD:main
